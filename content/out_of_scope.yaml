# OUT_OF_SCOPE training corpus.
#
# WHY THIS FILE EXISTS (RESEARCH 2.4):
#
# A router with no reject option misroutes confidently, and a confident misroute on a credit
# product is mis-selling. Softmax forces probability mass onto some class by construction - it
# cannot express "none of these". Ask about a cash-advance rate against a glossary holding a
# purchase-APR entry and the router returns the purchase answer at high confidence.
#
# So OUT_OF_SCOPE is a TRAINED CLASS with its own examples, not the residue left over when
# nothing clears a threshold. Required alongside it:
#   - one-vs-rest sigmoid, not softmax
#   - per-class rejection thresholds, calibrated per language
#   - confidence bands (campaign_vars.yaml): >=0.80 act | >=0.50 act + flag | <0.50 deflect
#
# Every category below routes to an approved line plus a human. There is no generative branch.
# Categories marked `severity: safety` must additionally be tagged for async human review, and
# `priority: urgent` ones must not sit in a queue behind a sales transfer.

version: 0.1.0
status: synthetic
default_route: N99_FALLBACK_TRANSFER
categories:

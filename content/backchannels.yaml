# Approved acknowledgement tokens. The cheapest naturalness available to us.
#
# WHY THIS FILE EXISTS
#
# A bot sounds like a bot mostly because it never acknowledges anything. A human agent says
# "ji", "haan", "okay" before answering; the bot goes straight into its line. That single
# difference is most of the "reading a script" feeling, and it costs one short pre-rendered clip.
#
# This is naturalness WITHOUT generation. ADR-002 forbids the model composing customer-facing
# text, and that is not negotiable. But nothing stops us approving MORE ways to say the same
# thing. In a regulated voice product, naturalness is a content problem, not a model problem -
# and the ask to BLC is "approve three phrasings per line, not one", which is a far easier
# conversation than "let the model improvise".
#
# Every token here is [TransOrg]-invented and needs BLC approval like any other utterance.
# They are deliberately contentless: no token makes a claim, quantifies anything, or commits to
# anything, so the compliance risk of a wrong pick is close to zero.


  next: N02_CONFIRM_CARDHOLDER
- id: N02_CONFIRM_CARDHOLDER
  kind: normal
  faq_enabled: true
  faq_scope:
  - common
  intent_set:
  - CONFIRM_IDENTITY
  - AGREE
  - NOT_INTERESTED
  line:
    en: Am I speaking with {customer_first_name}?
    hi_latn: Kya main {customer_first_name} ji se baat kar rahi hoon?
    bn: আমি কি {customer_first_name} এর সাথে কথা বলছি?
    gu: શું હું {customer_first_name} સાથે વાત કરું છું?
    mr: मी {customer_first_name} यांच्याशी बोलतोय का?
    ta: நான் {customer_first_name} அவர்களிடம் பேசுகிறேனா?
    te: నేను {customer_first_name} గారితో మాట్లాడుతున్నానా?
    kn: ನಾನು {customer_first_name} ಅವರೊಂದಿಗೆ ಮಾತನಾಡುತ್ತಿದ್ದೇನೆಯೇ?
    ml: ഞാൻ {customer_first_name} യോടാണോ സംസാരിക്കുന്നത്?
    hi: क्या मैं {customer_first_name} जी से बात कर रही हूँ?
  routes:
    CONFIRM_IDENTITY: N03_PURPOSE
    AGREE: N03_PURPOSE
    NOT_INTERESTED: N40_CLOSE_NOT_INTERESTED
- id: N03_PURPOSE
  kind: chain
  line:
    en: I am calling about an offer available on your card. It will take about a minute.
    hi_latn: Main aapke card par available ek offer ke baare mein call kar rahi hoon. Sirf ek minute lagega.
    bn: আমি আপনার কার্ডে থাকা একটি অফার নিয়ে কল করছি। প্রায় এক মিনিট লাগবে।
    gu: હું તમારા કાર્ડ પરની એક ઓફર વિશે કોલ કરું છું. લગભગ એક મિનિટ લાગશે.
    mr: मी तुमच्या कार्डवरील एका ऑफरबद्दल कॉल करतोय. फक्त एक मिनिट लागेल.
    ta: உங்கள் கார்டில் உள்ள ஒரு ஆஃபர் பற்றி கால் பண்ணுகிறேன். ஒரு நிமிடம் தான் ஆகும்.
    te: మీ కార్డ్ పై ఉన్న ఒక ఆఫర్ గురించి కాల్ చేస్తున్నాను. ఒక నిమిషం పడుతుంది.
    kn: ನಿಮ್ಮ ಕಾರ್ಡ್ ಮೇಲಿನ ಒಂದು ಆಫರ್ ಬಗ್ಗೆ ಕಾಲ್ ಮಾಡುತ್ತಿದ್ದೇನೆ. ಸುಮಾರು ಒಂದು ನಿಮಿಷ ಆಗುತ್ತದೆ.
    ml: നിങ്ങളുടെ കാർഡിലുള്ള ഒരു ഓഫറിനെക്കുറിച്ച് വിളിക്കുന്നു. ഏകദേശം ഒരു മിനിറ്റ് എടുക്കും.
    hi: मैं आपके कार्ड पर उपलब्ध एक ऑफर के बारे में कॉल कर रही हूँ. सिर्फ़ एक मिनट लगेगा.
  next: N04_PITCH
- id: N04_PITCH
  kind: normal
  requires_disclosure:
  - D01_IDENTITY
  - D02_RECORDED_LINE
  faq_enabled: true
  faq_scope:
  - common
  - flexipay
  intent_set:
  - INTERESTED
  - AGREE
  - NOT_INTERESTED
  - NEED_TIME
  - IS_THIS_GENUINE
  - HOW_DID_YOU_GET_NUMBER
  line:
    en: You are eligible to convert purchases above {min_txn_amt} rupees into easy monthly instalments. On your card, up to {eligible_amount} rupees can be converted over {tenure_options}.
    hi_latn: Aap {min_txn_amt} rupees se upar ke purchases ko aasaan monthly instalments mein convert kar sakte hain. Aapke card par {eligible_amount} rupees tak, {tenure_options} mein convert ho sakta
      hai.
    bn: আপনি {min_txn_amt} টাকার উপরের কেনাকাটা সহজ মাসিক কিস্তিতে পরিবর্তন করতে পারেন। আপনার কার্ডে {eligible_amount} টাকা পর্যন্ত, {tenure_options} এ পরিবর্তন করা যাবে।
    gu: તમે {min_txn_amt} રૂપિયાથી વધુની ખરીદીને સરળ માસિક હપ્તામાં ફેરવી શકો છો. તમારા કાર્ડ પર {eligible_amount} રૂપિયા સુધી, {tenure_options} માં ફેરવી શકાય છે.
    mr: तुम्ही {min_txn_amt} रुपयांवरील खरेदी सोप्या मासिक हप्त्यांमध्ये बदलू शकता. तुमच्या कार्डवर {eligible_amount} रुपयांपर्यंत, {tenure_options} मध्ये बदलता येईल.
    ta: '{min_txn_amt} ரூபாய்க்கு மேல் உள்ள பர்ச்சேஸ்களை எளிய மாத தவணைகளாக மாற்றலாம். உங்கள் கார்டில் {eligible_amount} ரூபாய் வரை, {tenure_options} ல் மாற்ற முடியும்.'
    te: '{min_txn_amt} రూపాయల పైన ఉన్న పర్చేజ్‌లను సులభమైన నెలవారీ వాయిదాలుగా మార్చుకోవచ్చు. మీ కార్డ్ పై {eligible_amount} రూపాయల వరకు, {tenure_options} లో మార్చవచ్చు.'
    kn: '{min_txn_amt} ರೂಪಾಯಿಗಿಂತ ಹೆಚ್ಚಿನ ಖರೀದಿಗಳನ್ನು ಸುಲಭ ಮಾಸಿಕ ಕಂತುಗಳಾಗಿ ಬದಲಾಯಿಸಬಹುದು. ನಿಮ್ಮ ಕಾರ್ಡ್ ಮೇಲೆ {eligible_amount} ರೂಪಾಯಿವರೆಗೆ, {tenure_options} ನಲ್ಲಿ ಬದಲಾಯಿಸಬಹುದು.'
    ml: '{min_txn_amt} രൂപയ്ക്ക് മുകളിലുള്ള പർച്ചേസുകൾ എളുപ്പമുള്ള മാസ തവണകളാക്കി മാറ്റാം. നിങ്ങളുടെ കാർഡിൽ {eligible_amount} രൂപ വരെ, {tenure_options} ൽ മാറ്റാൻ കഴിയും.'
    hi: आप {min_txn_amt} रुपये से ऊपर की ख़रीदारी को आसान मासिक क़िस्तों में बदल सकते हैं. आपके कार्ड पर {eligible_amount} रुपये तक, {tenure_options} में बदला जा सकता है.
  never_say:
  - guaranteed approval
  - no interest
  - zero cost
  - free loan
  - pre-approved loan
  routes:
    INTERESTED: N05_TERMS
    AGREE: N05_TERMS
    NOT_INTERESTED: N40_CLOSE_NOT_INTERESTED
    NEED_TIME: N10_OBJECTION_NEED_TIME
    IS_THIS_GENUINE: N11_OBJECTION_TRUST
    HOW_DID_YOU_GET_NUMBER: N12_HOW_GOT_NUMBER
- id: N05_TERMS
  kind: chain
  plays_disclosure:
  - D03_FLEXIPAY_TERMS
  line:
    en: At a tenure of {tenure_months} months, your indicative instalment would be about {indicative_emi} rupees per month.
    hi_latn: '{tenure_months} mahine ki tenure par, aapki indicative instalment lagbhag {indicative_emi} rupees monthly hogi.'
    bn: '{tenure_months} মাসের মেয়াদে, আপনার আনুমানিক কিস্তি মাসে প্রায় {indicative_emi} টাকা হবে।'
    gu: '{tenure_months} મહિનાની મુદત પર, તમારો અંદાજિત હપ્તો દર મહિને લગભગ {indicative_emi} રૂપિયા થશે.'
    mr: '{tenure_months} महिन्यांच्या मुदतीवर, तुमचा अंदाजे हप्ता दरमहा सुमारे {indicative_emi} रुपये असेल.'
    ta: '{tenure_months} மாத தவணையில், உங்கள் மாதாந்திர தவணை தோராயமாக {indicative_emi} ரூபாய் இருக்கும்.'
    te: '{tenure_months} నెలల వ్యవధిలో, మీ అంచనా వాయిదా నెలకు సుమారు {indicative_emi} రూపాయలు ఉంటుంది.'
    kn: '{tenure_months} ತಿಂಗಳ ಅವಧಿಯಲ್ಲಿ, ನಿಮ್ಮ ಅಂದಾಜು ಕಂತು ತಿಂಗಳಿಗೆ ಸುಮಾರು {indicative_emi} ರೂಪಾಯಿ ಆಗುತ್ತದೆ.'
    ml: '{tenure_months} മാസത്തെ കാലാവധിയിൽ, നിങ്ങളുടെ ഏകദേശ തവണ മാസം {indicative_emi} രൂപ ആയിരിക്കും.'
    hi: '{tenure_months} महीने की अवधि पर, आपकी अनुमानित क़िस्त हर महीने लगभग {indicative_emi} रुपये होगी.'
  next: N06_AGREEMENT_PROBE
- id: N06_AGREEMENT_PROBE
  kind: normal
  requires_disclosure:
  - D03_FLEXIPAY_TERMS
  faq_enabled: true
  faq_scope:
  - common
  - flexipay
  intent_set:
  - AGREE
  - NOT_INTERESTED
  - NEED_TIME
  line:
    en: Shall I connect you to our advisor to take this forward?
    hi_latn: Kya main aapko hamare advisor se connect karoon, aage badhane ke liye?
    bn: এগিয়ে যাওয়ার জন্য আমি কি আপনাকে আমাদের অ্যাডভাইজারের সাথে যুক্ত করব?
    gu: આગળ વધવા માટે હું તમને અમારા એડવાઇઝર સાથે જોડું?
    mr: पुढे जाण्यासाठी मी तुम्हाला आमच्या अ‍ॅडव्हायझरशी जोडू का?
    ta: இதை தொடர எங்கள் அட்வைசரிடம் உங்களை இணைக்கட்டுமா?
    te: దీన్ని ముందుకు తీసుకెళ్ళడానికి మిమ్మల్ని మా అడ్వైజర్ కు కనెక్ట్ చేయనా?
    kn: ಇದನ್ನು ಮುಂದುವರಿಸಲು ನಿಮ್ಮನ್ನು ನಮ್ಮ ಅಡ್ವೈಸರ್ ಗೆ ಕನೆಕ್ಟ್ ಮಾಡಲೇ?
    ml: ഇത് മുന്നോട്ട് കൊണ്ടുപോകാൻ ഞാൻ നിങ്ങളെ ഞങ്ങളുടെ അഡ്വൈസറുമായി ബന്ധിപ്പിക്കട്ടെ?
    hi: आगे बढ़ने के लिए क्या मैं आपको हमारे एडवाइज़र से जोड़ूँ?
  never_say:
  - your loan is approved
  - the amount will be credited
  routes:
    AGREE: N07_PRE_TRANSFER
    NOT_INTERESTED: N40_CLOSE_NOT_INTERESTED
    NEED_TIME: N10_OBJECTION_NEED_TIME
- id: N07_PRE_TRANSFER
  kind: chain
  requires_disclosure:
  - D03_FLEXIPAY_TERMS
  plays_disclosure:
  - D06_ADVISOR_HANDOFF
  line:
    en: Thank you. Please stay on the line.
    hi_latn: Dhanyavaad. Kripya line par bane rahiye.
    bn: ধন্যবাদ। অনুগ্রহ করে লাইনে থাকুন।
    gu: આભાર. કૃપા કરીને લાઇન પર રહો.
    mr: धन्यवाद. कृपया लाइनवर थांबा.
    ta: நன்றி. தயவுசெய்து லைனில் இருங்கள்.
    te: ధన్యవాదాలు. దయచేసి లైన్ లో ఉండండి.
    kn: ಧನ್ಯವಾದಗಳು. ದಯವಿಟ್ಟು ಲೈನ್ ನಲ್ಲಿ ಇರಿ.
    ml: നന്ദി. ദയവായി ലൈനിൽ തുടരുക.
    hi: धन्यवाद. कृपया लाइन पर बने रहिए.
  next: N08_TRANSFER

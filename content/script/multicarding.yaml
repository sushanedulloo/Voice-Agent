# Multicarding (additional card) - bot-side state machine.
#
# SYNTHETIC. Every line is [TransOrg]-invented and must be replaced by the BLC-approved script.
#
# No IVR on this product (CH-MULTICARD). After transfer the Ops advisor verifies the customer,
# fills the multicarding form and triggers a C2B link to the registered mobile; the customer
# completes it with an OTP. All of that is advisor-side and is NOT modelled here - the bot never
# sends a link, never mentions an OTP, and never asks for one.


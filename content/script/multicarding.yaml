- id: N03_PURPOSE
  kind: chain
  line:
    en: I am calling about an additional card available to you. It will take about a minute.
    hi_latn: Main aapke liye available ek additional card ke baare mein call kar rahi hoon. Lagbhag ek minute lagega.
    bn: আমি আপনার জন্য উপলব্ধ একটি অতিরিক্ত কার্ড নিয়ে কল করছি। প্রায় এক মিনিট লাগবে।
    gu: હું તમારા માટે ઉપલબ્ધ વધારાના કાર્ડ વિશે કોલ કરું છું. લગભગ એક મિનિટ લાગશે.
    mr: मी तुमच्यासाठी उपलब्ध असलेल्या अतिरिक्त कार्डबद्दल कॉल करतोय. सुमारे एक मिनिट लागेल.
    ta: உங்களுக்கு கிடைக்கும் கூடுதல் கார்டு பற்றி கால் பண்ணுகிறேன். ஒரு நிமிடம் ஆகும்.
    te: మీకు అందుబాటులో ఉన్న అదనపు కార్డ్ గురించి కాల్ చేస్తున్నాను. ఒక నిమిషం పడుతుంది.
    kn: ನಿಮಗೆ ಲಭ್ಯವಿರುವ ಹೆಚ್ಚುವರಿ ಕಾರ್ಡ್ ಬಗ್ಗೆ ಕಾಲ್ ಮಾಡುತ್ತಿದ್ದೇನೆ. ಸುಮಾರು ಒಂದು ನಿಮಿಷ ಆಗುತ್ತದೆ.
    ml: നിങ്ങൾക്ക് ലഭ്യമായ ഒരു അധിക കാർഡിനെക്കുറിച്ച് വിളിക്കുന്നു. ഏകദേശം ഒരു മിനിറ്റ് എടുക്കും.
    hi: मैं आपके लिए उपलब्ध एक अतिरिक्त कार्ड के बारे में कॉल कर रही हूँ. लगभग एक मिनट लगेगा.
  next: N04_PITCH
- id: N04_PITCH
  kind: normal
  requires_disclosure:
  - D01_IDENTITY
  - D02_RECORDED_LINE
  faq_enabled: true
  faq_scope:
  - common
  - multicarding
  intent_set:

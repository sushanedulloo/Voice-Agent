  - ALREADY_HAVE_CARD
  - IS_THIS_GENUINE
  - HOW_DID_YOU_GET_NUMBER
  line:
    en: You are eligible for an additional {brand_name} card, the {offered_card_name}, which offers {headline_benefit}.
    hi_latn: Aap ek additional {brand_name} card, {offered_card_name}, ke liye eligible hain, jismein {headline_benefit} milta hai.
    bn: আপনি একটি অতিরিক্ত {brand_name} কার্ডের জন্য যোগ্য, {offered_card_name}, যাতে {headline_benefit} পাওয়া যায়।
    gu: તમે વધારાના {brand_name} કાર્ડ માટે પાત્ર છો, {offered_card_name}, જેમાં {headline_benefit} મળે છે.
    mr: तुम्ही अतिरिक्त {brand_name} कार्डसाठी पात्र आहात, {offered_card_name}, ज्यामध्ये {headline_benefit} मिळते.
    ta: நீங்கள் கூடுதல் {brand_name} கார்டுக்கு தகுதி பெற்றுள்ளீர்கள், {offered_card_name}, இதில் {headline_benefit} கிடைக்கும்.
    te: మీరు అదనపు {brand_name} కార్డ్ కు అర్హులు, {offered_card_name}, ఇందులో {headline_benefit} లభిస్తుంది.
    kn: ನೀವು ಹೆಚ್ಚುವರಿ {brand_name} ಕಾರ್ಡ್ ಗೆ ಅರ್ಹರಾಗಿದ್ದೀರಿ, {offered_card_name}, ಇದರಲ್ಲಿ {headline_benefit} ಸಿಗುತ್ತದೆ.
    ml: നിങ്ങൾക്ക് ഒരു അധിക {brand_name} കാർഡിന് അർഹതയുണ്ട്, {offered_card_name}, അതിൽ {headline_benefit} ലഭിക്കും.
    hi: आप एक अतिरिक्त {brand_name} कार्ड के लिए पात्र हैं, {offered_card_name}, जिसमें {headline_benefit} मिलता है.

    - ഡി എൻ ഡി യിൽ ഇടൂ
    - എന്റെ നമ്പർ മാറ്റൂ
    examples_mr:
    - मला कॉल करू नका
    - डी एन डी मध्ये टाका
    - माझा नंबर काढून टाका
    examples_gu:

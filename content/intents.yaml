# Global intent vocabulary. Node `intent_set`s draw from this file.
#
# SCRIPT MATTERS. indic-conformer emits NATIVE SCRIPT (Devanagari for Hindi, Tamil
# script for Tamil, and so on). The router compares ASR output against these examples
# by string similarity, so romanised examples score 0.000 against real ASR output and
# every turn deflects. `examples_hi` are the Devanagari anchors; `examples_hi_latn`
# stay because the TTS voice takes romanised input and typed demo input uses it.
# Found by testing, not by review - see the note in engine/router.py.
#
# `global: true` means the intent is routable from EVERY non-terminal node.

version: 0.1.0
status: synthetic
intents:
  DNC:
    global: true
    severity: regulatory
    description: Asks not to be called, mentions DND/DNC, or withdraws permission to contact.
    examples_en:
    - don't call me again
    - put me on DND
    - remove my number
    - stop calling
    examples_hi_latn:
    - mujhe call mat karo
    - DND pe daal do
    - number hata do
    examples_hi:
    - मुझे कॉल मत करो
    - डी एन डी पे डाल दो
    - नंबर हटा दो
    - कॉल करना बंद करो
    examples_ta:

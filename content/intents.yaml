    - டி என் டி ல போடுங்க
    - என் நம்பர ரிமூவ் பண்ணுங்க
    examples_te:
    - నాకు కాల్ చేయకండి
    - డి ఎన్ డి లో పెట్టండి
    - నా నంబర్ తీసేయండి
    examples_kn:
    - ನನಗೆ ಕಾಲ್ ಮಾಡಬೇಡಿ
    - ಡಿ ಎನ್ ಡಿ ಗೆ ಹಾಕಿ
    - ನನ್ನ ನಂಬರ್ ತೆಗೆದುಹಾಕಿ
    examples_ml:
